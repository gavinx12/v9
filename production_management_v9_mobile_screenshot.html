<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生產管理表</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f4f7fb;color:#172033;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}
.container{max-width:1100px;margin:auto;padding:24px}
.card{
  background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;
  box-shadow:0 3px 14px rgba(0,0,0,.07)
}
.header{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-bottom:20px
}
h1{margin:0;font-size:30px;font-weight:800}
.date{font-size:14px;color:#667085;margin-top:6px}
button{
  border:0;border-radius:9px;padding:11px 16px;font-size:15px;
  font-weight:700;cursor:pointer
}
.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.danger{background:#dc2626;color:white}
.secondary{background:#e5e7eb;color:#172033}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.form-grid{
  display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;
  gap:12px;align-items:end
}
label{display:block;font-size:13px;color:#667085;margin-bottom:6px}
input,select{
  width:100%;height:46px;border:1px solid #cfd6df;border-radius:9px;
  padding:0 12px;font-size:16px;background:#fff
}
input:focus{outline:2px solid #93c5fd;border-color:#60a5fa}
.hint{font-size:13px;color:#667085;margin-top:10px;line-height:1.5}

.summary-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px
}
.summary-box{
  background:#f7f9fc;border-radius:13px;padding:18px;text-align:center
}
.summary-title{font-size:16px}
.summary-value{font-size:30px;font-weight:800;margin-top:7px}
.good{color:#059669}.ng{color:#dc2626}.send{color:#2563eb}

.capture{
  background:#fff;border-radius:12px;padding:24px;
}
.capture-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:20px;margin-bottom:18px
}
.capture-title{font-size:30px;font-weight:800;margin:0}
.capture-time{font-size:13px;color:#667085;margin-top:5px}
table{width:100%;border-collapse:collapse}
th,td{
  padding:15px 12px;border-bottom:1px solid #e5e7eb;
  text-align:center;font-size:16px
}
th{font-size:15px;color:#475467}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:800}
.completed{color:#059669;font-weight:800}
.ngnum{color:#dc2626;font-weight:800}
.remaining{font-weight:700}

.history-wrap{overflow-x:auto}
.history-table{min-width:700px}
.empty{text-align:center;color:#98a2b3;padding:24px}

.delete-btn{padding:7px 10px;font-size:13px}
.small{font-size:12px;color:#667085}

@media(max-width:800px){
  .form-grid{grid-template-columns:1fr 1fr}
  .form-grid .full-mobile{grid-column:1/-1}
  .summary-grid{grid-template-columns:1fr}
  .capture-title{font-size:24px}
}
</style>
</head>
<body>
<div class="container">

  <!-- 輸入區：不會被截圖 -->
  <div class="header">
    <div>
      <h1>生產管理表</h1>
      <div class="date" id="todayText"></div>
    </div>
    <div class="actions">
      <button class="primary" onclick="addRecord()">新增今日資料</button>
      <button class="success" onclick="captureTable()">📷 截圖累計資訊</button>
      <button class="secondary" onclick="exportCSV()">⬇ 匯出歷史紀錄</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin:0 0 16px">今日輸入</h2>
    <div class="form-grid">
      <div class="full-mobile">
        <label>料號</label>
        <select id="partNo"></select>
      </div>
      <div>
        <label>今日良品數量</label>
        <input id="goodInput" type="number" step="1" placeholder="可輸入負數">
      </div>
      <div>
        <label>今日 NG 數量</label>
        <input id="ngInput" type="number" step="1" placeholder="可輸入負數">
      </div>
      <div>
        <label>修改總數（留白＝不修改）</label>
        <input id="totalInput" type="number" step="1" placeholder="可輸入負數">
      </div>
      <button class="primary" onclick="addRecord()">送出</button>
    </div>
    <div class="hint">
      規則：沒輸入的欄位不更新。<br>
      已完成＝原已完成＋今日良品；NG＝原 NG＋今日 NG；<br>
      <b>剩餘＝總數－已完成－NG</b>。總數可以隨時修改，輸入欄位允許負數。
    </div>
  </div>

  <!-- 今日摘要：網站顯示，但截圖不包含 -->
  <div class="card">
    <h2 style="margin:0 0 16px">📊 今日摘要</h2>
    <div class="summary-grid">
      <div class="summary-box">
        <div class="summary-title">今日良品</div>
        <div class="summary-value good" id="todayGood">0</div>
      </div>
      <div class="summary-box">
        <div class="summary-title">今日 NG</div>
        <div class="summary-value ng" id="todayNg">0</div>
      </div>
      <div class="summary-box">
        <div class="summary-title">今日總送出</div>
        <div class="summary-value send" id="todaySend">0</div>
      </div>
    </div>
  </div>

  <!-- 這個區塊就是截圖範圍：標題＋更新時間＋累計表，到 NG 欄位 -->
  <div class="capture" id="captureArea">
    <div class="capture-header">
      <div>
        <h2 class="capture-title" id="captureTitle"></h2>
        <div class="capture-time" id="updateTime"></div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>料號</th>
          <th>總數</th>
          <th>已完成</th>
          <th>剩餘</th>
          <th>NG</th>
        </tr>
      </thead>
      <tbody id="productionBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2 style="margin:0 0 16px">📜 歷史紀錄</h2>
    <div class="history-wrap">
      <table class="history-table">
        <thead>
          <tr>
            <th>日期</th>
            <th>時間</th>
            <th>料號</th>
            <th>良品數量</th>
            <th>NG數量</th>
            <th>總數修改</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
    <div class="small" style="margin-top:10px">
      歷史紀錄會保存在此瀏覽器的 LocalStorage；同一台裝置、同一瀏覽器重新開啟仍會保留。
    </div>
  </div>

</div>

<script>
const STORAGE_KEY = "production_management_v7_data";
const HISTORY_KEY = "production_management_v7_history";
const TIME_KEY = "production_management_v7_update_time";

const defaultData = [
  {part:"OS51B00272", total:3114, completed:960, ng:9},
  {part:"OS51B00273", total:2784, completed:1274, ng:105}
];

let data = loadData();
let history = loadHistory();

function loadData(){
  try{
    const x = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(x) && x.length ? x : structuredClone(defaultData);
  }catch(e){ return structuredClone(defaultData); }
}
function loadHistory(){
  try{
    const x = JSON.parse(localStorage.getItem(HISTORY_KEY));
    return Array.isArray(x) ? x : [];
  }catch(e){ return []; }
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  localStorage.setItem(TIME_KEY, new Date().toISOString());
}

function fmt(n){
  return Number(n).toLocaleString("zh-TW");
}
function numOrNull(id){
  const v = document.getElementById(id).value.trim();
  return v === "" ? null : Number(v);
}
function localDate(){
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
}
function localTime(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
}

function updateHeader(){
  const date = localDate();
  document.getElementById("todayText").textContent = `今天：${date}`;
  document.getElementById("captureTitle").textContent = `${date} 累計生產狀況`;

  const savedTime = localStorage.getItem(TIME_KEY);
  if(savedTime){
    const d = new Date(savedTime);
    document.getElementById("updateTime").textContent =
      `更新時間：${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
  }else{
    document.getElementById("updateTime").textContent = `更新時間：${date} ${localTime()}`;
  }
}

function renderSelect(){
  const select = document.getElementById("partNo");
  select.innerHTML = data.map(x => `<option value="${escapeHtml(x.part)}">${escapeHtml(x.part)}</option>`).join("");
}

function renderTable(){
  const body = document.getElementById("productionBody");
  body.innerHTML = data.map(x=>{
    const remaining = x.total - x.completed - x.ng;
    return `
      <tr>
        <td>${escapeHtml(x.part)}</td>
        <td>${fmt(x.total)}</td>
        <td class="completed">${fmt(x.completed)}</td>
        <td class="remaining">${fmt(remaining)}</td>
        <td class="ngnum">${fmt(x.ng)}</td>
      </tr>`;
  }).join("");
}

function renderHistory(){
  const body = document.getElementById("historyBody");
  if(!history.length){
    body.innerHTML = `<tr><td colspan="7" class="empty">目前尚無歷史紀錄</td></tr>`;
    return;
  }
  body.innerHTML = history.slice().reverse().map((r,i)=>{
    const realIndex = history.length - 1 - i;
    return `
      <tr>
        <td>${escapeHtml(r.date)}</td>
        <td>${escapeHtml(r.time)}</td>
        <td>${escapeHtml(r.part)}</td>
        <td class="completed">${fmt(r.good)}</td>
        <td class="ngnum">${fmt(r.ng)}</td>
        <td>${r.total === null ? "—" : fmt(r.total)}</td>
        <td><button class="danger delete-btn" onclick="deleteHistory(${realIndex})">刪除</button></td>
      </tr>`;
  }).join("");
}

function renderTodaySummary(){
  const today = localDate();
  const rows = history.filter(r => r.date === today);
  const good = rows.reduce((s,r)=>s + (Number(r.good)||0),0);
  const ng = rows.reduce((s,r)=>s + (Number(r.ng)||0),0);
  document.getElementById("todayGood").textContent = fmt(good);
  document.getElementById("todayNg").textContent = fmt(ng);
  document.getElementById("todaySend").textContent = fmt(good + ng);
}

function addRecord(){
  const part = document.getElementById("partNo").value;
  const good = numOrNull("goodInput");
  const ng = numOrNull("ngInput");
  const total = numOrNull("totalInput");

  if(good === null && ng === null && total === null){
    alert("請至少輸入一個要更新的欄位。");
    return;
  }

  const item = data.find(x=>x.part===part);
  if(!item){
    alert("找不到此料號。");
    return;
  }

  if(good !== null) item.completed += good;
  if(ng !== null) item.ng += ng;
  if(total !== null) item.total = total;

  history.push({
    date: localDate(),
    time: localTime(),
    part,
    good: good === null ? 0 : good,
    ng: ng === null ? 0 : ng,
    total
  });

  save();
  renderAll();

  document.getElementById("goodInput").value = "";
  document.getElementById("ngInput").value = "";
  document.getElementById("totalInput").value = "";
  alert("已更新累計資料並新增歷史紀錄。");
}

function deleteHistory(index){
  if(!confirm("確定要刪除這筆歷史紀錄嗎？刪除紀錄不會自動回復累計數字。")){
    return;
  }
  history.splice(index,1);
  save();
  renderAll();
}

function exportCSV(){
  if(!history.length){
    alert("目前沒有歷史紀錄可以匯出。");
    return;
  }
  const rows = [
    ["日期","時間","料號","良品數量","NG數量","總數修改"],
    ...history.map(r=>[r.date,r.time,r.part,r.good,r.ng,r.total===null?"":r.total])
  ];
  const csv = "\uFEFF" + rows.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `生產歷史紀錄_${localDate().replaceAll("/","-")}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

async function captureTable(){
  const button = event && event.currentTarget ? event.currentTarget : null;
  if(button) button.disabled = true;

  try{
    // 建立「手機專用截圖版」：固定寬度，避免手機因橫向捲動而只截到部分欄位。
    const original = document.getElementById("captureArea");
    const clone = original.cloneNode(true);

    clone.id = "captureAreaTemp";
    clone.style.position = "absolute";
    clone.style.left = "-10000px";
    clone.style.top = "0";
    clone.style.width = "920px";
    clone.style.maxWidth = "none";
    clone.style.overflow = "visible";
    clone.style.background = "#ffffff";
    clone.style.margin = "0";
    clone.style.boxShadow = "none";
    clone.style.borderRadius = "0";
    clone.style.padding = "28px";

    // 讓表格完整展開，確保 NG 欄一定在圖片裡。
    const table = clone.querySelector("table");
    if(table){
      table.style.width = "100%";
      table.style.minWidth = "0";
    }

    document.body.appendChild(clone);

    const canvas = await html2canvas(clone,{
      backgroundColor:"#ffffff",
      scale:2,
      useCORS:true,
      logging:false,
      width:920,
      windowWidth:920
    });

    document.body.removeChild(clone);

    const link = document.createElement("a");
    link.download = `累計生產狀況_${localDate().replaceAll("/","-")}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();

  }catch(e){
    const temp = document.getElementById("captureAreaTemp");
    if(temp) temp.remove();
    alert("截圖失敗，請重新整理網頁後再試一次。");
    console.error(e);
  }finally{
    if(button) button.disabled = false;
  }
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function renderAll(){
  updateHeader();
  renderSelect();
  renderTable();
  renderHistory();
  renderTodaySummary();
}

renderAll();
setInterval(updateHeader,1000);
</script>
</body>
</html>
